{% extends "base.html" %}


{% block content %}


<h2>Edit Data Kualitas Udara</h2>


<form method="POST">


    <div class="mb-3">

        <label>Lokasi</label>

        <input
            type="text"
            name="lokasi"
            value="{{ udara.lokasi }}"
            class="form-control"
        >

    </div>


    <div class="mb-3">

        <label>PM2.5</label>

        <input
            type="number"
            step="0.01"
            name="pm25"
            value="{{ udara.pm25 }}"
            class="form-control"
        >

    </div>


    <div class="mb-3">

        <label>PM10</label>

        <input
            type="number"
            step="0.01"
            name="pm10"
            value="{{ udara.pm10 }}"
            class="form-control"
        >

    </div>


    <div class="mb-3">

        <label>Suhu</label>

        <input
            type="number"
            step="0.01"
            name="suhu"
            value="{{ udara.suhu }}"
            class="form-control"
        >

    </div>


    <div class="mb-3">

        <label>Kelembaban</label>

        <input
            type="number"
            step="0.01"
            name="kelembaban"
            value="{{ udara.kelembaban }}"
            class="form-control"
        >

    </div>


    <div class="mb-3">

        <label>Kategori</label>

        <select
            name="kategori"
            class="form-control"
        >

            <option
                value="Baik"
                {% if udara.kategori == "Baik" %}
                selected
                {% endif %}
            >

                Baik

            </option>


            <option
                value="Sedang"
                {% if udara.kategori == "Sedang" %}
                selected
                {% endif %}
            >

                Sedang

            </option>


            <option
                value="Tidak Sehat"
                {% if udara.kategori == "Tidak Sehat" %}
                selected
                {% endif %}
            >

                Tidak Sehat

            </option>

        </select>

    </div>


    <button class="btn btn-primary">

        Update Data

    </button>


</form>


{% endblock %}
