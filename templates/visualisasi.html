{% extends "base.html" %}


{% block content %}


<h2>Dashboard Visualisasi Kualitas Udara</h2>


<div class="alert alert-info">

    Total Data:

    <strong>

        {{ total }}

    </strong>

</div>


<div class="row">


    <div class="col-md-6 mb-4">

        <div class="card">

            <div class="card-body">

                <h5>Bar Chart</h5>

                <img
                    src="{{ url_for(
                    'static',
                    filename='charts/bar.png'
                    ) }}"
                    class="img-fluid"
                >

            </div>

        </div>

    </div>


    <div class="col-md-6 mb-4">

        <div class="card">

            <div class="card-body">

                <h5>Pie Chart</h5>

                <img
                    src="{{ url_for(
                    'static',
                    filename='charts/pie.png'
                    ) }}"
                    class="img-fluid"
                >

            </div>

        </div>

    </div>


    <div class="col-md-6 mb-4">

        <div class="card">

            <div class="card-body">

                <h5>Line Chart PM2.5</h5>

                <img
                    src="{{ url_for(
                    'static',
                    filename='charts/line.png'
                    ) }}"
                    class="img-fluid"
                >

            </div>

        </div>

    </div>


    <div class="col-md-6 mb-4">

        <div class="card">

            <div class="card-body">

                <h5>Histogram PM2.5</h5>

                <img
                    src="{{ url_for(
                    'static',
                    filename='charts/histogram.png'
                    ) }}"
                    class="img-fluid"
                >

            </div>

        </div>

    </div>


    <div class="col-md-12 mb-4">

        <div class="card">

            <div class="card-body">

                <h5>Scatter Plot PM2.5 dan PM10</h5>

                <img
                    src="{{ url_for(
                    'static',
                    filename='charts/scatter.png'
                    ) }}"
                    class="img-fluid"
                >

            </div>

        </div>

    </div>


</div>


{% endblock %}
